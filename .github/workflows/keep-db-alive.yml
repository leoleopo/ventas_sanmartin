name: Keep Supabase Alive

on:
  schedule:
    # Cada 6 horas en minuto 17 (evita el pico de carga de GitHub a xx:00)
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: keep-supabase-alive
  cancel-in-progress: false

jobs:
  ping:
    name: Ping a la base de datos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ping
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail

          URL="${SUPABASE_URL:-https://vzzmuavylibrdswzagfp.supabase.co}"
          KEY="${SUPABASE_PUBLISHABLE_KEY:-sb_publishable_k2qX6MNFfC0r5qFHPKwnpQ_Mg92JzbS}"

          # Importante: /rest/v1/ exige service_role. Con una key publishable
          # el gateway responde 401 y nunca llega a Postgres, asi que no genera
          # actividad. Solo las queries contra tablas reales ejecutan SQL, y
          # eso es lo que Supabase mira para decidir si pausa el proyecto.
          #
          # Prefer: count=exact hace que PostgREST ejecute ademas un plan
          # count(*), o sea el doble de actividad por request.
          #
          # Un 401/403 de RLS NO es un fallo: la query ya se ejecuto contra
          # Postgres antes de aplicar el filtro de filas. Solo son fatales
          # los 5xx y los errores de conexion.
          ping() {
            local path="$1" label="$2" code
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 \
              -H "apikey: $KEY" \
              -H "Authorization: Bearer $KEY" \
              -H "Prefer: count=exact" \
              "$URL$path") || code="000"

            case "$code" in
              2*) echo "  $label: HTTP $code" ;;
              401|403) echo "  $label: HTTP $code (RLS lo denies, pero la query si llego a Postgres)" ;;
              *) echo "  $label: HTTP $code" ; return 1 ;;
            esac
            return 0
          }

          for attempt in 1 2 3 4 5; do
            echo "Intento $attempt:"

            if ping "/rest/v1/productos?select=id&limit=1" "productos" \
              && ping "/rest/v1/pedidos?select=id&limit=1" "pedidos"; then
              echo "Base de datos activa."
              exit 0
            fi

            [ "$attempt" -lt 5 ] && sleep $((attempt * 15))
          done

          echo "::error::La base de datos no responde"
          exit 1

  heartbeat:
    name: Commit de actividad
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # GitHub desactiva los cron de repos publicos tras 60 dias sin
          # actividad, y las corridas del workflow no cuentan como actividad.
          # Hay que commitear antes de llegar a ese limite: con un umbral de
          # 10 dias el margen es de 50 dias, muy por debajo del corte.
          # Cada commit dispara un deploy de Vercel, por eso no es mas seguido.
          LAST=$(git log -1 --format=%ct)
          NOW=$(date -u +%s)
          DAYS=$(( (NOW - LAST) / 86400 ))

          if [ "$DAYS" -lt 10 ]; then
            echo "Ultimo commit hace $DAYS dias. No hace falta actividad."
            exit 0
          fi

          echo "Ultimo commit hace $DAYS dias. Generando actividad."
          git commit --allow-empty -m "chore: keepalive $(date -u +%Y-%m-%d)"
          git push
